<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6ef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (() => {
        let theme = "light";
        try {
          const savedTheme = localStorage.getItem("tasseigo-theme");
          const systemTheme = window.matchMedia?.("(prefers-color-scheme: dark)");
          theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : systemTheme?.matches ? "dark" : "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta name="description" content="Explore fitness spaces and manage your TasseiGō member or business workspace." />
    <title>TasseiGō App — Fitness, in one place</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to app content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
